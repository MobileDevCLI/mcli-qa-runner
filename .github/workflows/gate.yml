name: Emulator gate
# Test-only: downloads debug APKs from this repo's test-apks release and runs the QA gate. Publishes nothing.
on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [cleanscan, rentharbor, bizharbor, all]
        default: cleanscan
      steps:
        description: Crawler steps
        default: "80"
permissions:
  contents: read
concurrency:
  group: gate-${{ inputs.app }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'all' && '["cleanscan","rentharbor","bizharbor"]' || format('["{0}"]', inputs.app)) }}
    env:
      GATE_STEPS: ${{ inputs.steps }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download debug APK
        run: mkdir -p apks && gh release download test-apks -p "${{ matrix.app }}-debug.apk" -D apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1
      - name: Create AVD snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot created"
      - name: Gate (crawl + stress + regressions)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash -o pipefail -c "bash qa/gate.sh ${{ matrix.app }} 2>&1 | tee gate.log"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.app }}
          retention-days: 3
          compression-level: 9
          path: |
            gate.log
            qa/reports/
